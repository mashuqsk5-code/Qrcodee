<!DOCTYPE html>
<html>
<head>
    <script>
        // URL se card ka number (id) nikaalne ke liye
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        // Default link agar id match na ho
        let destination = "https://google.com"; 

        if (cardId === "1") {
            destination = "https://shhd745954-cmyk.github.io/Review/?name=My%20Business&g=https://search.google.com/local/writereview?placeid=ChIJl5rG3rhZNDoRqfi5I-qH_mA&wa=https://wa.me/qr/VXEESEVHMUERB1&ig=https://instagram.com"; 
        } else if (cardId === "2") {
            destination = "https://google.com"; 
        }

        // Automatic Redirect
        window.location.href = destination;
    </script>
</head>
<body>
    <p>Redirecting to business page...</p>
</body>
</html>
