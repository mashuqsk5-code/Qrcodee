<!DOCTYPE html>
<html>
<head>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        // Yahan aap saare clients ke links ek choti si list (dictionary) mein save kar sakte hain
        const database = {
            "1": "https://maps.app.goo.gl/SyACHk4BcmBTZtKk6",
            "2": "https://g.page/r/example-client-2",
            "3": "https://g.page/r/example-client-3",
            // Jaise-jaise naye clients aayein, yahan unki ID aur link add karte jayein
        };

        // Agar ID database mein milti hai wahan bhejo, warna default Google par
        let destination = database[cardId] || "https://google.com";

        // Redirect
        window.location.href = destination;
    </script>
</head>
<body>
    <p>Redirecting to business page...</p>
</body>
</html>
