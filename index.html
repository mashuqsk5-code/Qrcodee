<!DOCTYPE html>
<html>
<head>
    <script>
        // URL se card ka number (id) nikaalne ke liye
        const urlParams = new URLSearchParams(window.location.search);
        const cardId = urlParams.get('id');

        // Default link agar id match na ho
        let destination = "https://google.com"; 

        // Yahan apni ID aur apna review page link check karein
        if (cardId === "1") {
            destination = "https://shhd745954-cmyk.github.io/Review/?name=...&g=...&wa=...&ig=..."; 
        } else if (cardId === "2") {
            destination = "https://google.com"; 
        }

        // Automatic Redirect
        window.location.href = destination;
    </script>
</head>
<body>
    <p>Redirecting to business page...</p>
</body>
</html>
